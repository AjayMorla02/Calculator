<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Calculator</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="calculator">
    <header class="display">
      <p class="expression" id="expression" aria-live="polite"></p>
      <p class="result" id="result">0</p>
    </header>

    <section class="keypad" role="group" aria-label="Calculator keypad">
      <div class="operators">
      <button type="button" class="key key-fn" data-action="clear">All Clear</button>
      <button type="button" class="key key-fn" data-action="operator" data-value="%">%</button>
      <button type="button" class="key key-op" data-action="operator" data-value="/">÷</button>
      <button type="button" class="key key-op" data-action="operator" data-value="+">+</button>
      <button type="button" class="key" data-action="decimal">.</button>
      <button type="button" class="key key-op" data-action="operator" data-value="*">×</button>
      <button type="button" class="key key-op" data-action="operator" data-value="-">−</button>
      </div>

      <div>
      <button type="button" class="key" data-action="digit" data-value="1">1</button>
      <button type="button" class="key" data-action="digit" data-value="2">2</button>
      <button type="button" class="key" data-action="digit" data-value="3">3</button>
      <button type="button" class="key" data-action="digit" data-value="4">4</button>
      <button type="button" class="key" data-action="digit" data-value="5">5</button>
      <button type="button" class="key" data-action="digit" data-value="6">6</button>
      <button type="button" class="key" data-action="digit" data-value="7">7</button>
      <button type="button" class="key" data-action="digit" data-value="8">8</button>
      <button type="button" class="key" data-action="digit" data-value="9">9</button>
      <button type="button" class="key key-zero" data-action="digit" data-value="0">0</button>
      <button type="button" class="key key-equals" data-action="equals">Cal</button>
      </div>
    </section>
  </main>

  <script src="script2.js"></script>
</body>
</html>
